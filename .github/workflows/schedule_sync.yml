name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
      company:
        description: 'Ferry company posting this update'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U "google-genai>=2.3.0" requests
      - name: Scrape with Interactions API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          PAYLOAD_COMPANY: ${{ github.event.client_payload.company }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
          INPUT_COMPANY: ${{ inputs.company }}
        run: |
          python3 << 'PY'
          import os, re, json, base64, requests
          from google import genai

          url = (os.environ.get("PAYLOAD_IMAGE_URL") or os.environ.get("INPUT_IMAGE_URL") or "").strip()
          company_hint = (os.environ.get("PAYLOAD_COMPANY") or os.environ.get("INPUT_COMPANY") or "").strip()
          print(f"URL: {url}")
          print(f"Company hint: {company_hint}")

          if not url:
              print("No image URL provided. Exiting without changes.")
              raise SystemExit(0)

          # -------------------------------------------------------------
          # 1. Fetch image (resolving FB HTML permalinks to direct CDN URLs)
          # -------------------------------------------------------------
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
          }
          res = requests.get(url, headers=headers, timeout=15)
          content_type = res.headers.get("Content-Type", "").lower()

          if "text/html" in content_type:
              direct_url = None
              og_match = re.search(r'property="og:image"\s+content="([^"]+)"', res.text)
              if og_match:
                  direct_url = og_match.group(1).replace("&amp;", "&")
              if not direct_url:
                  scontent_match = re.search(r'https://scontent[^"\\]+', res.text)
                  if scontent_match:
                      direct_url = scontent_match.group(0).replace("\\/", "/").replace("&amp;", "&")
              if not direct_url:
                  print("Could not resolve a direct image URL from the HTML page. Exiting.")
                  raise SystemExit(0)
              print(f"Resolved FB Page to direct CDN image: {direct_url[:70]}...")
              img_res = requests.get(direct_url, headers=headers, timeout=15)
              img_bytes = img_res.content
              mime_type = img_res.headers.get("Content-Type", "image/jpeg").split(";")[0]
          else:
              img_bytes = res.content
              mime_type = content_type.split(";")[0] or "image/jpeg"

          if not mime_type or "image" not in mime_type:
              mime_type = "image/jpeg"

          b64 = base64.b64encode(img_bytes).decode('utf-8')

          # -------------------------------------------------------------
          # 2. Ask Gemini ONLY for cancellations / exclusive-availability,
          #    not a full re-transcription of the schedule.
          # -------------------------------------------------------------
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          company_line = (
              f'The company posting this is "{company_hint}". Use this exact company name in your output.'
              if company_hint else
              'Identify the ferry operator/company name from the image header.'
          )

          prompt = f"""
          You are looking at a Facebook post image from a Puerto Galera <-> Batangas ferry
          operator. {company_line}

          YOUR ONLY JOB: determine whether this image changes which trips are running today.
          Do NOT transcribe the full schedule. Only report exceptions.

          There are two possible kinds of posts:

          A) CANCELLATION POST - explicitly lists one or more trip times that are
             CANCELLED or SUSPENDED today.
             -> mode = "cancelled", times = the list of cancelled departure times.

          B) AVAILABILITY POST - explicitly says only a specific trip/time (or small set of
             times) IS running today (e.g. "trip available 10AM", "only trip today: 7:30AM").
             This implies every OTHER normal trip from this same company is cancelled today.
             -> mode = "available_only", times = the list of times that ARE running.

          If the image is NOT a ferry schedule / trip-status announcement at all (e.g. it's a
          general promo, event photo, unrelated announcement, meme, etc.), return an empty
          "updates" array.

          If a direction (BATANGAS TO BALATERO = toBAT, or BALATERO TO BATANGAS = toPG) is
          clearly indicated, include it. If not specified or it applies to both directions,
          set "direction" to "both".

          Field values must contain ONLY the final extracted value - no reasoning, no
          alternative phrasing, no explanations. A time value must look exactly like "10:00 AM".

          Return your answer as JSON matching the provided schema.
          """

          schema = {
              "type": "object",
              "properties": {
                  "updates": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "company": {"type": "string"},
                              "direction": {"type": "string", "enum": ["toPG", "toBAT", "both"]},
                              "mode": {"type": "string", "enum": ["cancelled", "available_only"]},
                              "times": {"type": "array", "items": {"type": "string"}}
                          },
                          "required": ["company", "direction", "mode", "times"]
                      }
                  }
              },
              "required": ["updates"]
          }

          interaction = client.interactions.create(
              model="gemini-3.6-flash",
              input=[
                  {"type": "text", "text": prompt},
                  {"type": "image", "data": b64, "mime_type": mime_type}
              ],
              generation_config={"thinking_level": "minimal"},
              response_format={
                  "type": "text",
                  "mime_type": "application/json",
                  "schema": schema
              }
          )

          txt = interaction.output_text
          print(f"RAW: {txt}")
          result = json.loads(txt)
          updates = result.get("updates", [])
          print(f"UPDATES: {updates}")

          if not updates:
              print("No relevant schedule exceptions found in this post. Exiting without changes.")
              raise SystemExit(0)

          # -------------------------------------------------------------
          # 3. Merge updates onto a FRESH COPY of the master schedule.
          #    Master schedule is never modified on disk - index.html is
          #    regenerated from it plus today's exceptions every run.
          # -------------------------------------------------------------
          with open("master_schedule.json", "r", encoding="utf-8") as f:
              master = json.load(f)

          # Aliases so "Galerian Water Transport Services" (FB page name / Gemini
          # guess) matches "Galerian Water" (short name used in master_schedule.json)
          ALIASES = {
              "galerian water transport services": "Galerian Water",
              "galerian water": "Galerian Water",
              "galerian": "Galerian Water",
              "montenegro shipping lines": "Montenegro",
              "montenegro": "Montenegro",
              "island water": "Island Water",
              "island simara": "Island Simara",
          }

          def normalize_company(name):
              key = re.sub(r'\s+', ' ', name or "").strip().lower()
              return ALIASES.get(key, name.strip() if name else name)

          def normalize_time(t):
              t = re.sub(r'\s+', ' ', (t or "").strip().upper())
              t = t.replace("AM", " AM").replace("PM", " PM")
              t = re.sub(r'\s+', ' ', t).strip()
              return t

          schedule = {
              "toPG": [dict(trip) for trip in master.get("toPG", [])],
              "toBAT": [dict(trip) for trip in master.get("toBAT", [])],
          }

          def directions_for(direction):
              if direction == "both":
                  return ["toPG", "toBAT"]
              return [direction]

          for upd in updates:
              company = normalize_company(upd.get("company", ""))
              mode = upd.get("mode")
              times = {normalize_time(t) for t in upd.get("times", [])}
              if not company or not times:
                  continue

              for direction in directions_for(upd.get("direction", "both")):
                  trips = schedule.get(direction, [])
                  company_trips = [t for t in trips if t.get("company") == company]
                  if not company_trips:
                      print(f"WARNING: no master trips matched company '{company}' in {direction}")
                      continue

                  if mode == "cancelled":
                      for trip in company_trips:
                          if normalize_time(trip.get("time")) in times:
                              trip["status"] = "CANCELLED"
                              trip["note"] = "CANCELLED TODAY"

                  elif mode == "available_only":
                      for trip in company_trips:
                          if normalize_time(trip.get("time")) not in times:
                              trip["status"] = "CANCELLED"
                              trip["note"] = "CANCELLED TODAY"
                          else:
                              trip.pop("status", None)
                              trip.pop("note", None)

          # -------------------------------------------------------------
          # 4. Write merged schedule into index.html
          # -------------------------------------------------------------
          html = open('index.html', 'r', encoding='utf-8').read()
          updated_html = re.sub(
              r'const schedule = \{[\s\S]*?\};',
              f'const schedule = {json.dumps(schedule, indent=2)};',
              html
          )
          open('index.html', 'w', encoding='utf-8').write(updated_html)
          print("index.html successfully updated with today's schedule exceptions!")
          PY
      - name: Commit and push changes
        run: |
          git config --global user.name 'Schedule Bot'
          git config --global user.email 'bot@galeraguide.com'
          git add index.html
          git commit -m "Auto-synced ferry schedule exceptions [skip ci]" || exit 0
          git push
