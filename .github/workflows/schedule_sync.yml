name: Daily Ferry Schedule Sync
on:
  repository_dispatch:
    types: [fb_image_payload]
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct FB Image URL'
        required: false
        type: string

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- THIS WAS MISSING
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run schedule scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config user.name 'Schedule Bot'
          git config user.email 'bot@galeraguide.com'
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-synced ferry schedules [skip ci]"
          git push
