name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/gemini-cli@latest
      - name: Scrape and update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          URL="${PAYLOAD_IMAGE_URL:-$INPUT_IMAGE_URL}"
          curl -L -A "Mozilla/5.0" -o ./ferry.jpg "$URL"
          gemini --model gemini-2.0-flash --yolo --skip-trust -p "Extract BATANGAS to BALATERO and BALATERO to BATANGAS ferry schedule from @./ferry.jpg . Return ONLY JSON {\"toPG\":[{\"company\":\"Montenegro\",\"time\":\"7:30 AM\"}],\"toBAT\":[{\"company\":\"Montenegro\",\"time\":\"8:30 AM\"}]}. No markdown." > ./out.txt
          cat ./out.txt
          python3 -c "
          import re, json, sys
          txt=open('./out.txt').read()
          print(txt)
          m=re.search(r'\{[\s\S]*\}', txt)
          if not m:
            print('No JSON, exit'); sys.exit(1)
          data=json.loads(m.group(0))
          html=open('index.html','r',encoding='utf-8').read()
          s=html.index('const schedule = {')
          e=html.index('let currentDir', s)
          open('index.html','w',encoding='utf-8').write(html[:s]+f'const schedule = {json.dumps(data,indent=2)};\n\n  let currentDir'+html[e+12:])
          "
          rm -f ./ferry.jpg ./out.txt
      - name: Push
        run: |
          git config user.name 'bot'
          git config user.email 'bot@github.com'
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-sync ferry" && git push)
