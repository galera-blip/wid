name: Daily Ferry Schedule Sync

on:
  schedule:
    # 21:30 UTC = 5:30 AM Manila Time (runs automatically every morning)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions tab

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai requests

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name 'Schedule Bot'
          git config --global user.email 'bot@galeraguide.com'
          git add index.html
          git commit -m "Auto-synced daily schedules from Facebook [skip ci]" || exit 0
          git push
