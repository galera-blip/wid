name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U "google-genai>=2.3.0" requests
      - name: Scrape with Interactions API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 << 'PY'
          import os, re, json, base64, requests
          from google import genai

          url = (os.environ.get("PAYLOAD_IMAGE_URL") or os.environ.get("INPUT_IMAGE_URL") or "").strip()
          print(f"URL: {url}")

          if not url:
              print("No image URL provided. Exiting without changes.")
              raise SystemExit(0)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
          }

          res = requests.get(url, headers=headers, timeout=15)
          content_type = res.headers.get("Content-Type", "").lower()

          # If the URL is an FB HTML permalink (not a direct image), resolve the real image URL
          if "text/html" in content_type:
              direct_url = None
              og_match = re.search(r'property="og:image"\s+content="([^"]+)"', res.text)
              if og_match:
                  direct_url = og_match.group(1).replace("&amp;", "&")
              if not direct_url:
                  scontent_match = re.search(r'https://scontent[^"\\]+', res.text)
                  if scontent_match:
                      direct_url = scontent_match.group(0).replace("\\/", "/").replace("&amp;", "&")
              if not direct_url:
                  print("Could not resolve a direct image URL from the HTML page. Exiting.")
                  raise SystemExit(0)
              print(f"Resolved FB Page to direct CDN image: {direct_url[:70]}...")
              img_res = requests.get(direct_url, headers=headers, timeout=15)
              img_bytes = img_res.content
              mime_type = img_res.headers.get("Content-Type", "image/jpeg").split(";")[0]
          else:
              img_bytes = res.content
              mime_type = content_type.split(";")[0] or "image/jpeg"

          if not mime_type or "image" not in mime_type:
              mime_type = "image/jpeg"

          b64 = base64.b64encode(img_bytes).decode('utf-8')

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          prompt = """
          Analyze ferry schedule image.

          1. Extract ALL trips for Batangas <-> Balatero, even if marked CANCELLED.
          2. NEVER delete cancelled trips - keep them.
          3. If trip says CANCELLED/SUSPENDED: set "status":"CANCELLED" and "note":"CANCELLED TODAY"
          4. company: header or "Galerian Water Transport Services"
          5. vessel: short name like "PTERIPPUS 1" max 15 chars, "" if unsure
          6. type: Fastcraft or RoRo
          7. toPG = Batangas to Balatero, toBAT = Balatero to Batangas
          """

          schema = {
              "type": "object",
              "properties": {
                  "toPG": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "company": {"type": "string"},
                              "type": {"type": "string"},
                              "vessel": {"type": "string"},
                              "time": {"type": "string"},
                              "status": {"type": "string"},
                              "note": {"type": "string"}
                          },
                          "required": ["company", "time"]
                      }
                  },
                  "toBAT": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "company": {"type": "string"},
                              "type": {"type": "string"},
                              "vessel": {"type": "string"},
                              "time": {"type": "string"},
                              "status": {"type": "string"},
                              "note": {"type": "string"}
                          },
                          "required": ["company", "time"]
                      }
                  }
              },
              "required": ["toPG", "toBAT"]
          }

          interaction = client.interactions.create(
              model="gemini-3.6-flash",
              input=[
                  {"type": "text", "text": prompt},
                  {"type": "image", "data": b64, "mime_type": mime_type}
              ],
              response_format={
                  "type": "text",
                  "mime_type": "application/json",
                  "schema": schema
              }
          )

          txt = interaction.output_text
          print(f"RAW: {txt}")
          data = json.loads(txt)
          print(f"PARSED: {data}")

          if not data.get("toPG") and not data.get("toBAT"):
              print("No relevant schedule data extracted. Exiting without changes.")
              raise SystemExit(0)

          html = open('index.html', 'r', encoding='utf-8').read()
          updated_html = re.sub(
              r'const schedule = \{[\s\S]*?\};',
              f'const schedule = {json.dumps(data, indent=2)};',
              html
          )
          open('index.html', 'w', encoding='utf-8').write(updated_html)
          print("index.html successfully updated with live schedules!")
          PY
      - name: Commit and push changes
        run: |
          git config --global user.name 'Schedule Bot'
          git config --global user.email 'bot@galeraguide.com'
          git add index.html
          git commit -m "Auto-synced ferry schedules [skip ci]" || exit 0
          git push
