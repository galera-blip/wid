name: Daily Ferry Schedule Sync

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct FB Image URL'
        required: false
        default: ''
  repository_dispatch:
    types: [facebook_post]

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai requests

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ github.event.inputs.image_url }}
        run: python scraper.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name 'Schedule Bot'
          git config --global user.email 'bot@galeraguide.com'
          git add index.html
          git commit -m "Auto-synced daily schedules from Facebook [skip ci]" || exit 0
          git push
