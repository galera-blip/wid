name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai
      - name: Scrape and update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 << 'PY'
          import os, re, json, base64, requests
          from google import genai

          url = os.environ.get("PAYLOAD_IMAGE_URL") or os.environ.get("INPUT_IMAGE_URL")
          print(f"Downloading {url}")
          img = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}).content
          open("./ferry.jpg","wb").write(img)

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          
          with open("./ferry.jpg","rb") as f:
            img_b64 = base64.b64encode(f.read()).decode()

          resp = client.models.generate_content(
            model="gemini-2.0-flash",
            contents=[
              {
                "role":"user",
                "parts":[
                  {"text":"Extract BATANGAS to BALATERO and BALATERO to BATANGAS ferry schedule from this image. Return ONLY valid JSON like {\"toPG\":[{\"company\":\"Montenegro\",\"time\":\"7:30 AM\"}],\"toBAT\":[{\"company\":\"Montenegro\",\"time\":\"8:30 AM\"}]}. No markdown."},
                  {"inline_data":{"mime_type":"image/jpeg","data":img_b64}}
                ]
              }
            ]
          )
          txt = resp.text
          print("GEMINI RAW:", txt)
          m = re.search(r'\{[\s\S]*\}', txt)
          data = json.loads(m.group(0))
          print("PARSED:", data)

          html = open('index.html','r',encoding='utf-8').read()
          s = html.index('const schedule = {')
          e = html.index('let currentDir', s)
          open('index.html','w',encoding='utf-8').write(html[:s]+f'const schedule = {json.dumps(data,indent=2)};\n\n  let currentDir'+html[e+12:])
          print("DONE")
          PY
      - name: Push
        run: |
          git config user.name 'bot'
          git config user.email 'bot@github.com'
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-sync ferry" && git push)
