name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U "google-genai>=2.0.0" requests
      - name: Scrape with Interactions API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 << 'PY'
          import os, re, json, base64, requests
          from google import genai

          url = os.environ.get("PAYLOAD_IMAGE_URL") or os.environ.get("INPUT_IMAGE_URL")
          print(f"URL: {url}")
          img_bytes = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}).content
          b64 = base64.b64encode(img_bytes).decode('utf-8')

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          # NEW Interactions API pattern - from ai.google.dev/gemini-api/docs/image-understanding
          interaction = client.interactions.create(
            model="gemini-2.5-flash",
            input=[
              {"type":"text","text":"Extract BATANGAS to BALATERO and BALATERO to BATANGAS ferry schedule. Return ONLY JSON {\"toPG\":[{\"company\":\"Montenegro\",\"time\":\"7:30 AM\"}],\"toBAT\":[{\"company\":\"Montenegro\",\"time\":\"8:30 AM\"}]}. No markdown."},
              {"type":"image","data":b64,"mime_type":"image/jpeg"}
            ]
          )

          txt = interaction.output_text
          print(f"RAW: {txt}")
          m = re.search(r'\{[\s\S]*\}', txt)
          if not m:
              raise ValueError("No JSON found")
          data = json.loads(m.group(0))
          print(f"PARSED: {data}")

          html = open('index.html','r',encoding='utf-8').read()
          s = html.index('const schedule = {')
          e = html.index('let currentDir', s)
          open('index.html','w',encoding='utf-8').write(html[:s]+f'const schedule = {json.dumps(data,indent=2)};\n\n  let currentDir'+html[e+12:])
          print("DONE")
          PY
      - name: Push
        run: |
          git config user.name 'bot'
          git config user.email 'bot@github.com'
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-sync ferry [Interactions API]" && git push)
