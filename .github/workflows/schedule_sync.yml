name: Daily Ferry Schedule Sync
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct image URL'
        required: false
        type: string
  repository_dispatch:
    types: [ferry_schedule_update]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai requests
      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_IMAGE_URL: ${{ github.event.client_payload.image_url }}
          INPUT_IMAGE_URL: ${{ inputs.image_url }}
        run: python scraper.py
      - name: Push
        run: |
          git config user.name 'bot'
          git config user.email 'bot@github.com'
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-sync" && git push)
